<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep, vibrant electric-indigo squircle backdrop -->
    <linearGradient id="sv-bg" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6470FF" />
      <stop offset="46%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1B1654" />
    </linearGradient>

    <!-- Controlled ambient lighting -->
    <radialGradient id="sv-glow-top" cx="0.24" cy="0.14" r="0.62">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sv-glow-cyan" cx="0.80" cy="0.88" r="0.58">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp inner glass rim -->
    <linearGradient id="sv-rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.24" />
    </linearGradient>

    <!-- Headset pure white-to-ice gradient -->
    <linearGradient id="sv-headset" x1="256" y1="96" x2="256" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8FF" />
    </linearGradient>

    <!-- High-contrast electric cyan voice equalizer gradient -->
    <linearGradient id="sv-wave" x1="256" y1="204" x2="256" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <filter id="sv-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F0B3B" flood-opacity="0.46" />
    </filter>
    <filter id="sv-wave-glow" x="-30%" y="-25%" width="160%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="512" height="512" rx="116" fill="url(#sv-bg)" />
  <rect width="512" height="512" rx="116" fill="url(#sv-glow-top)" />
  <rect width="512" height="512" rx="116" fill="url(#sv-glow-cyan)" />
  <rect x="6" y="6" width="500" height="500" rx="110" stroke="url(#sv-rim)" stroke-width="4" />

  <!-- Acoustic Headset Mark (centered optically with boom mic) -->
  <g transform="translate(0, -10)" filter="url(#sv-shadow)">
    <!-- Sculpted headband arch -->
    <path
      d="M110 264C110 176 174 108 256 108C338 108 402 176 402 264C402 273 395 280 386 280C377 280 370 273 370 264C370 195 320 142 256 142C192 142 142 195 142 264C142 273 135 280 126 280C117 280 110 273 110 264Z"
      fill="url(#sv-headset)"
    />

    <!-- Left earcup cushion + shell -->
    <rect x="142" y="248" width="22" height="88" rx="11" fill="#C7D2FE" fill-opacity="0.88" />
    <rect x="96" y="230" width="54" height="124" rx="27" fill="url(#sv-headset)" />

    <!-- Right earcup cushion + shell -->
    <rect x="348" y="248" width="22" height="88" rx="11" fill="#C7D2FE" fill-opacity="0.88" />
    <rect x="362" y="230" width="54" height="124" rx="27" fill="url(#sv-headset)" />

    <!-- Boom-mic arm + capsule -->
    <path
      d="M388 334C388 378 354 402 296 402H272"
      stroke="url(#sv-headset)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <rect x="232" y="390" width="52" height="24" rx="12" fill="url(#sv-headset)" />
  </g>

  <!-- Live Voice Equalizer Bars -->
  <g transform="translate(0, -10)" filter="url(#sv-wave-glow)">
    <rect x="196" y="252" width="26" height="80" rx="13" fill="url(#sv-wave)" />
    <rect x="243" y="214" width="26" height="138" rx="13" fill="url(#sv-wave)" />
    <rect x="290" y="240" width="26" height="98" rx="13" fill="url(#sv-wave)" />
  </g>
</svg>
