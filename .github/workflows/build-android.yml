name: Build & Distribute Android App

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web client
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL || vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_DEFAULT_INVITE_CODE: ${{ secrets.VITE_DEFAULT_INVITE_CODE || vars.VITE_DEFAULT_INVITE_CODE || 'SQUAD-2026' }}
          VITE_TURN_WORKER_URL: ${{ secrets.VITE_TURN_WORKER_URL || vars.VITE_TURN_WORKER_URL }}
        run: npm run build

      - name: Sync Capacitor Android assets
        working-directory: client
        run: npx cap sync android

      - name: Build Android APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p release-assets
          cp client/android/app/build/outputs/apk/debug/app-debug.apk release-assets/SquadVoice-Android.apk
          ls -lh release-assets/

      - name: Publish APK to rolling latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release upload latest release-assets/SquadVoice-Android.apk --repo "$REPO" --clobber
          else
            gh release create latest release-assets/SquadVoice-Android.apk --repo "$REPO" --target "$SHA" --latest --title "SquadVoice (En Güncel)" --notes "Windows, macOS ve Android kurulum dosyaları."
          fi

      - name: Authenticate with Google Cloud for Firebase App Distribution
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: Distribute APK to Firebase App Distribution
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID || vars.FIREBASE_ANDROID_APP_ID || '1:1068358115704:android:c8a4fb6728fd21f075288d' }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'ekip' }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          GROUPS_FLAG=""
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            GROUPS_FLAG="--groups $FIREBASE_TESTER_GROUPS"
          fi
          npx -y firebase-tools@latest appdistribution:distribute release-assets/SquadVoice-Android.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --release-notes "SquadVoice Android otomatik sürüm (${SHORT_SHA}) — arka planda kesintisiz ses servisi." \
            $GROUPS_FLAG || echo "::warning::Firebase App Distribution upload skipped (enable App Distribution in Firebase Console or check service account role Firebase App Distribution Admin)."
